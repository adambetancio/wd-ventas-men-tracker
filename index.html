const $ = id => document.getElementById(id);
const money = n => "$" + new Intl.NumberFormat("en-US",{
  minimumFractionDigits:0,maximumFractionDigits:2
}).format(n);
const entries = value => Object.entries(value || {});
const values = value => Object.values(value || {});
const clone = value => JSON.parse(JSON.stringify(value));
const cents = n => Math.round(Number(n || 0) * 100);
const cleanSearch = value => String(value).normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").toLowerCase();

function phoneKey(phone){
  const key = String(phone).replace(/\D/g,"");
  if(key.length < 7 || key.length > 15)
    throw Error("Escribe un teléfono válido de 7 a 15 dígitos.");
  return key;
}
function amount(value, optional=false){
  if(value === "" || value === null || value === undefined){
    if(optional) return null;
    throw Error("Escribe un importe.");
  }
  const n = Number(value);
  if(!Number.isFinite(n) || n < 0 || n > 100000000 ||
    Math.abs(n*100-Math.round(n*100)) > 0.000001)
    throw Error("Usa un importe válido con un máximo de dos decimales.");
  return n;
}
function totals(person){
  const total = values(person.items).reduce((s,i)=>s+cents(i.price),0);
  const paid = values(person.payments).reduce((s,p)=>s+cents(p.amount),0);
  return {total:total/100,paid:paid/100,balance:(total-paid)/100};
}
function totalLine(person){
  const t = totals(person);
  return `Total: ${money(t.total)} | Pagado: ${money(t.paid)} | Saldo: ${money(t.balance)}`;
}
function photoSource(photo){
  if(!photo) return "";
  if(/^data:image\/(?:jpeg|png|webp|gif);base64,[a-zA-Z0-9+/=\s]+$/.test(photo))
    return photo;
  if(/^[a-zA-Z0-9][a-zA-Z0-9_. -]*\.(?:jpg|jpeg|png|webp|gif)$/i.test(photo))
    return "./images/" + encodeURIComponent(photo);
  return "";
}

function el(tag,text,className){
  const node = document.createElement(tag);
  if(text!==undefined && text!==null) node.textContent=text;
  if(className) node.className=className;
  return node;
}
function notify(message){ $("notice").textContent=message; }
function fail(error){
  console.error(error);
  const msg = String(error?.message || error);
  notify(/permission|denied/i.test(msg)
    ? "Firebase rechazó la operación. Revisa los permisos de lectura y escritura."
    : msg);
}
function button(text,fn){
  const b=el("button",text); b.type="button";
  b.addEventListener("click",async()=>{
    if(b.disabled) return;
    b.disabled=true;
    try{await fn();}catch(e){fail(e);}
    finally{b.disabled=false;}
  });
  return b;
}
function field(label,type="text",required=false){
  const l=el("label",label);
  const input=el(type==="textarea" ? "textarea":"input");
  if(type!=="textarea") input.type=type;
  input.required=required;
  if(type==="number"){input.min="0";input.step="0.01";}
  l.append(input);
  return {label:l,input};
}
function submitForm(form,fn){
  form.addEventListener("submit",async event=>{
    event.preventDefault();
    const buttons=[...form.querySelectorAll("button")];
    buttons.forEach(b=>b.disabled=true);
    try{await fn();}catch(e){fail(e);}
    finally{buttons.forEach(b=>b.disabled=false);}
  });
}
function submitButton(text){
  const b=el("button",text); b.type="submit"; return b;
}
function confirmAction(text,labelValue){
  return new Promise(resolve=>{
    const dialog=$("confirmation");
    $("confirmation-text").textContent=text;
    $("confirmation-label").hidden=labelValue===undefined;
    $("confirmation-input").value=labelValue ?? "";
    dialog.returnValue="";
    dialog.addEventListener("close",()=>resolve({
      ok:dialog.returnValue==="confirm",
      value:$("confirmation-input").value.trim()
    }),{once:true});
    dialog.showModal();
    $("confirm-button").focus();
  });
}
function editor(host,label,getValue,save,type="text",optional=false){
  const wrapper=el("div","", "inline-editor");
  const launch=button(label,()=>{
    control.input.value=getValue() ?? "";
    form.hidden=false; launch.hidden=true; control.input.focus();
  });
  const form=el("form");form.hidden=true;
  const control=field(label,type,!optional);
  const actions=el("div","", "actions");
  const close=()=>{form.hidden=true;launch.hidden=false;};
  actions.append(submitButton("Guardar"),button("Cancelar",close));
  form.append(control.label,actions);
  submitForm(form,async()=>{
    await save(control.input.value);
    close();
  });
  wrapper.append(launch,form);host.append(wrapper);
}

async function readPhoto(file){
  if(!file) return null;
  if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))
    throw Error("Selecciona una imagen JPG, PNG, WEBP o GIF.");
  if(file.size>20*1024*1024)
    throw Error("La imagen debe pesar menos de 20 MB.");
  const url=URL.createObjectURL(file);
  try{
    const image=new Image();image.src=url;
    await image.decode();
    const ratio=Math.min(1,1600/Math.max(image.width,image.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(image.width*ratio));
    canvas.height=Math.max(1,Math.round(image.height*ratio));
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas.toDataURL("image/jpeg",.85);
  }finally{URL.revokeObjectURL(url);}
}

  a.download="wd-ventas-men-"+new Date().toISOString().slice(0,10)+".json";
  a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);

    }catch(e){fail(e);}finally{upload.value="";}
  });
  actions.append(
    button("Cambiar foto",()=>upload.click()),
    button("Quitar",async()=>{itemAt(key,id);await remove(ref(db,base));})
  );
  node.append(upload);
  let previousPhoto;
  return {
    node,
    refresh(item){
      name.textContent=item.name;
      price.textContent=item.price==null ? "precio por confirmar":money(item.price);
      date.textContent=item.date || "";
      detail.textContent=item.detail || "";
      flag.textContent=item.flag || "";flag.hidden=!item.flag;
      if(previousPhoto!==item.photo){
        previousPhoto=item.photo;
        const src=photoSource(item.photo);
        photo.replaceChildren(el("span","Sin foto"));
        if(src){
          const img=el("img");img.alt=item.name;img.loading="lazy";
          img.addEventListener("error",()=>photo.replaceChildren(el("span","Sin foto")));
          img.src=src;photo.replaceChildren(img);
        }
      }
      const img=photo.querySelector("img");
      if(img)img.alt=item.name;
    }
  };
}

function personView(key){
  const node=el("article","", "card");
  const head=el("div","", "person-head");
  const toggle=el("button","", "person-name");
  toggle.type="button";toggle.setAttribute("aria-expanded","false");
  const total=el("span","", "person-total");
  head.append(toggle,total);
  const phone=el("div","", "muted");
  const balance=el("div","", "balance");
  const actions=el("div","", "actions");
  const note=el("div","", "note");
  const body=el("div","", "body");body.hidden=true;
  const itemContainer=el("div","", "items");
  const itemViews=new Map();
  const noItems=el("p","Sin artículos.","muted");
  body.append(itemContainer,noItems);
  toggle.addEventListener("click",()=>{
    body.hidden=!body.hidden;
    toggle.setAttribute("aria-expanded",String(!body.hidden));
  });
  node.append(head,phone,balance,actions,note,body);

  editor(actions,"Editar nombre",()=>personAt(key).name,async value=>{
    if(!value.trim())throw Error("Escribe un nombre.");
    personAt(key);
    await write(personPath(key)+"/name",value.trim());
  });
  editor(actions,"Editar teléfono",()=>personAt(key).phone,async value=>{
    const newKey=phoneKey(value),newPhone=value.trim();
    if(newKey===key){
      await write(personPath(key)+"/phone",newPhone);return;
    }
    const result=await runTransaction(ref(db,"tracker/people"),current=>{
      if(!current?.[key] || current[newKey])return;
      const next={...current};
      next[newKey]={...current[key],phone:newPhone};
      delete next[key];return next;
    },{applyLocally:false});
    if(!result.committed)
      throw Error("No se pudo cambiar el teléfono: ya existe o la persona fue eliminada.");
  },"tel");
  actions.append(
    button("Compartir por WhatsApp",()=>{
      const text=shareMessage(personAt(key));
      window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(text),
        "_blank","noopener,noreferrer");
    }),
    button("Eliminar",async()=>{
      const p=personAt(key);
      if((await confirmAction(`¿Eliminar a ${p.name} y todos sus artículos?`)).ok)
        await remove(ref(db,personPath(key)));
    })
  );
  editor(node,"Editar nota",()=>personAt(key).note,async value=>{
    personAt(key);await write(personPath(key)+"/note",value.trim() || null);
  },"textarea",true);

  const addSection=el("section","", "section");
  addSection.append(el("h3","Agregar artículo"));
  const addForm=el("form");
  const product=field("Nombre del producto","text",true);
  const cost=field("Precio (opcional)","number");
  const when=field("Fecha (opcional)");
  const details=field("Detalle (opcional)");
  const picture=field("Foto (opcional)","file");
  picture.input.accept="image/jpeg,image/png,image/webp,image/gif";
  const pair=el("div","", "two");pair.append(cost.label,when.label);
  addForm.append(product.label,pair,details.label,picture.label,submitButton("Agregar artículo"));
  submitForm(addForm,async()=>{
    const name=product.input.value.trim();
    if(!name)throw Error("Escribe el nombre del producto.");
    const item={
      name,price:amount(cost.input.value,true),
      date:when.input.value.trim(),detail:details.input.value.trim(),
      flag:null,photo:await readPhoto(picture.input.files[0])
    };
    personAt(key);
    await set(push(ref(db,personPath(key)+"/items")),item);
    addForm.reset();
  });
  addSection.append(addForm);body.append(addSection);

  const paymentSection=el("section","", "section");
  paymentSection.append(el("h3","Pagos"));
  const payments=el("div");
  const paymentForm=el("form");
  const payAmount=field("Monto","number",true);payAmount.input.min=".01";
  const payNote=field("Nota (opcional)");
  paymentForm.append(payAmount.label,payNote.label,submitButton("Registrar pago"));
  submitForm(paymentForm,async()=>{
    const value=amount(payAmount.input.value);
    if(value<=0)throw Error("El pago debe ser mayor que cero.");
    personAt(key);
    await set(push(ref(db,personPath(key)+"/payments")),{
      amount:value,note:payNote.input.value.trim(),date:new Date().toISOString()
    });
    paymentForm.reset();
  });
  paymentSection.append(payments,paymentForm);body.append(paymentSection);

  return {
    node,
    refresh(person){
      const t=totals(person);
      toggle.textContent=person.name;
      phone.textContent=person.phone;
      total.textContent=money(t.total);
      balance.textContent=`Pagado: ${money(t.paid)} · Saldo: ${money(t.balance)}`;
      note.textContent=person.note || "";note.hidden=!person.note;
      const current=person.items || {};
      for(const [id,view] of itemViews){
        if(!Object.hasOwn(current,id)){view.node.remove();itemViews.delete(id);}
      }
      for(const [id,item] of entries(current)){
        let view=itemViews.get(id);
        if(!view){
          view=itemView(key,id);itemViews.set(id,view);itemContainer.append(view.node);
        }
        view.refresh(item);
      }
      noItems.hidden=entries(current).length>0;
      payments.replaceChildren();
      for(const [id,payment] of entries(person.payments)){
        const row=el("div","", "payment");
        const text=el("div");
        text.append(el("strong",money(payment.amount)));
        let dateText=payment.date || "";
        const parsed=new Date(dateText);
        if(dateText && !Number.isNaN(parsed.getTime()))
          dateText=new Intl.DateTimeFormat("es-MX",{
            dateStyle:"medium",timeStyle:"short",timeZone:"America/Monterrey"
          }).format(parsed);
        text.append(el("div",[dateText,payment.note].filter(Boolean).join(" · ")));
        row.append(text,button("Quitar pago",async()=>{
          personAt(key);
          await remove(ref(db,personPath(key)+"/payments/"+id));
        }));
        payments.append(row);
      }
      if(!entries(person.payments).length)payments.append(el("p","Sin pagos registrados.","muted"));
    }
  };
}

function render(){
  if(!data)return;
  const people=data.people || {};
  let total=0,paid=0,itemCount=0;
  for(const p of values(people)){
    const t=totals(p);
    total+=cents(t.total);paid+=cents(t.paid);
    itemCount+=values(p.items).length;
  }
  $("week").textContent=data.weekLabel || "Semana actual";
  $("summary").textContent=
    `Total: ${money(total/100)} | Pagado: ${money(paid/100)} | Saldo: ${money((total-paid)/100)}`;
  $("counts").textContent=`${values(people).length} personas · ${itemCount} artículos · MXN`;
  for(const [key,view] of cards){
    if(!Object.hasOwn(people,key)){view.node.remove();cards.delete(key);}
  }
  for(const [key,person] of entries(people)){
    let view=cards.get(key);
    if(!view){view=personView(key);cards.set(key,view);$("people").append(view.node);}
    view.refresh(person);
  }
  filter();
}
function filter(){
  const query=cleanSearch($("search").value.trim());
  const digits=query.replace(/\D/g,"");
  let shown=0;
  for(const [key,view] of cards){
    const p=data.people[key];
    const matches=!query ||
      cleanSearch(p.name+" "+p.phone).includes(query) ||
      (digits.length>0 && p.phone.replace(/\D/g,"").includes(digits));
    view.node.hidden=!matches;
    if(matches)shown++;
  }
  $("empty").hidden=shown>0;
}
$("search").addEventListener("input",filter);

submitForm($("person-form"),async()=>{
  if(!ready)throw Error("Espera a que termine la conexión.");
  const form=$("person-form");
  const name=form.elements.name.value.trim();
  const phone=form.elements.phone.value.trim();
  if(!name)throw Error("Escribe un nombre.");
  const key=phoneKey(phone);
  const result=await runTransaction(ref(db,personPath(key)),current=>
    current===null ? {name,phone,note:null}:undefined,{applyLocally:false});
  if(!result.committed)throw Error("Ya existe una persona con ese teléfono.");
  form.reset();$("add-person").open=false;
});

$("export").addEventListener("click",()=>{try{exportData();}catch(e){fail(e);}});
$("import").addEventListener("click",()=>$("import-file").click());

function validateImport(raw){
  if(!raw || typeof raw!=="object" || !raw.people ||
    typeof raw.people!=="object")
    throw Error("El archivo debe contener un objeto con la propiedad people.");
  const result={
    weekLabel:typeof raw.weekLabel==="string" ? raw.weekLabel:initialWeek,
    currency:"MXN",people:{}
  };
  const validId=id=>/^[a-zA-Z0-9_-]{1,150}$/.test(id);
  for(const person of values(raw.people)){
    if(!person || typeof person.name!=="string" ||
      typeof person.phone!=="string" || !person.name.trim())
      throw Error("Hay una persona con nombre o teléfono inválido.");
    const key=phoneKey(person.phone);
    if(Object.hasOwn(result.people,key))throw Error("Hay teléfonos duplicados.");
    const p={
      name:person.name,phone:person.phone,
      note:typeof person.note==="string"?person.note:null,items:{},payments:{}
    };
    for(const [oldId,item] of entries(person.items)){
      if(!item || typeof item.name!=="string" || !item.name.trim())
        throw Error("Hay un artículo sin nombre válido.");
      const id=Array.isArray(person.items)?"item_"+oldId:oldId;
      if(!validId(id))throw Error("Identificador de artículo inválido.");
      if(item.photo && !photoSource(item.photo))throw Error("Hay una foto inválida.");
      p.items[id]={
        name:item.name,price:amount(item.price,true),
        date:typeof item.date==="string"?item.date:"",
        detail:typeof item.detail==="string"?item.detail:"",
        flag:typeof item.flag==="string"?item.flag:null,
        photo:item.photo || null
      };
    }
    for(const [oldId,payment] of entries(person.payments)){
      const id=Array.isArray(person.payments)?"payment_"+oldId:oldId;
      if(!validId(id) || !payment)throw Error("Pago inválido.");
      const value=amount(payment.amount);
      if(value<=0)throw Error("Los pagos deben ser mayores que cero.");
      p.payments[id]={
        amount:value,note:typeof payment.note==="string"?payment.note:"",
        date:typeof payment.date==="string"?payment.date:""
      };
    }
    result.people[key]=p;
  }
  return result;
}
$("import-file").addEventListener("change",async event=>{
  try{
    const file=event.target.files[0];if(!file)return;
    if(file.size>50*1024*1024)throw Error("El archivo debe pesar menos de 50 MB.");
    const imported=validateImport(JSON.parse(await file.text()));
    const answer=await confirmAction(
      "¿Reemplazar todos los datos compartidos con este archivo? Se descargará una copia de los datos actuales antes de continuar.");
    if(!answer.ok)return;
    exportData();
    await set(ref(db,"tracker"),imported);
    notify("Datos importados.");
  }catch(e){fail(e);}finally{event.target.value="";}
});

$("new-week").addEventListener("click",async()=>{
  try{
    const first=await confirmAction(
      "Nueva semana: se conservarán las personas, sus teléfonos y sus notas. Se quitarán todos los artículos y pagos.",
      "Semana nueva");
    if(!first.ok)return;
    if(!first.value)throw Error("Escribe la etiqueta de la nueva semana.");
    const second=await confirmAction(
      "¿Confirmar el inicio de la nueva semana? Se descargará una copia antes de borrar los artículos y pagos.");
    if(!second.ok)return;
    exportData();
    const changes={weekLabel:first.value};
    for(const key of Object.keys(data.people || {})){
      changes["people/"+key+"/items"]=null;
      changes["people/"+key+"/payments"]=null;
    }
    await update(ref(db,"tracker"),changes);
    notify("Nueva semana iniciada.");
  }catch(e){fail(e);}
});

try{
  const [appSDK,databaseSDK]=await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js")
  ]);
  ({ref,set,update,remove,push,runTransaction,onValue,get}=databaseSDK);
  db=databaseSDK.getDatabase(appSDK.initializeApp(firebaseConfig));
  const tracker=ref(db,"tracker");

  // La transacción impide que dos primeras visitas sobrescriban datos.
  const existing=await get(tracker);
  if(!existing.exists()){
    await runTransaction(tracker,current=>
      current===null ? clone(seed):undefined,{applyLocally:false});
  }

  onValue(tracker,snapshot=>{
    data=snapshot.val() || {weekLabel:initialWeek,currency:"MXN",people:{}};
    ready=true;
    render();
    for(const id of ["new-week","export","import"])$(id).disabled=false;
    $("person-form").querySelector("button").disabled=false;
  },error=>{
    $("status").textContent="No se pudieron leer los datos.";
    fail(error);
  });
  onValue(ref(db,".info/connected"),snapshot=>{
    $("status").textContent=snapshot.val()
      ? "Conectado · Cambios compartidos en tiempo real"
      : "Sin conexión · Mantén esta página abierta hasta que se guarden los cambios";
  });
}catch(error){
  $("status").textContent="No se pudo conectar con Firebase.";
  fail(error);
}
</script>
