// All arithmetic uses integer cents. Calendar dates use Monterrey's local day.
const WEEK_OPTIONS = [1, 3, 5, 7, 10, 13, 15];
const INITIAL_WEEK = '2026-11-09';
const INITIAL_LABEL = 'Semana del 9 al 15 de noviembre de 2026';
const records = value => Object.entries(value || {});
const list = value => Object.values(value || {});
const cents = value => Math.round(Number(value || 0) * 100);
const money = value => '$' + new Intl.NumberFormat('en-US', {maximumFractionDigits: 2}).format(value / 100);
const normalize = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function validDate(value) {
  return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) &&
    !Number.isNaN(Date.parse(value + 'T12:00:00Z')) && new Date(value + 'T12:00:00Z').toISOString().slice(0,10) === value;
}
function addDays(date, days) {
  const result = new Date(date + 'T12:00:00Z');
  result.setUTCDate(result.getUTCDate() + days);
  return result.toISOString().slice(0,10);
}
function monday(date) {
  const day = new Date(date + 'T12:00:00Z').getUTCDay();
  return addDays(date, -((day + 6) % 7));
}
function localDate(value = new Date()) {
  const parts = new Intl.DateTimeFormat('en-US', {timeZone: 'America/Monterrey', year: 'numeric', month: '2-digit', day: '2-digit'}).formatToParts(new Date(value));
  const part = type => parts.find(p => p.type === type).value;
  return `${part('year')}-${part('month')}-${part('day')}`;
}
function readableDate(value) {
  return new Intl.DateTimeFormat('es-MX', {day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'}).format(new Date(value + 'T12:00:00Z'));
}
function weekLabel(start) {
  return `Semana del ${readableDate(start)} al ${readableDate(addDays(start, 6))}`;
}
function phoneKey(value) {
  const key = String(value).replace(/\D/g, '');
  if (key.length < 7 || key.length > 15) throw Error('Escribe un teléfono válido de 7 a 15 dígitos.');
  return key;
}
function parseAmount(value, optional = false) {
  if (value === '' || value == null) {
    if (optional) return null;
    throw Error('Escribe un importe.');
  }
  const number = Number(value);
  if (!Number.isFinite(number) || number < 0 || number > 100000000 || Math.abs(number * 100 - Math.round(number * 100)) > 0.000001) {
    throw Error('Escribe un importe válido con un máximo de dos decimales.');
  }
  return number;
}
function paymentDate(payment) {
  if (validDate(payment.paidOn)) return payment.paidOn;
  if (validDate(payment.date)) return payment.date;
  if (payment.date && !Number.isNaN(Date.parse(payment.date))) return localDate(payment.date);
  return null;
}
function migrateTracker(current) {
  if (!current) return null;
  const next = structuredClone(current);
  if (next.schemaVersion >= 2) return next;
  next.schemaVersion = 2;
  next.currency = 'MXN';
  next.activeWeek = validDate(next.activeWeek) ? next.activeWeek : INITIAL_WEEK;
  next.weeks = next.weeks || {};
  next.weeks[next.activeWeek] = next.weeks[next.activeWeek] || {
    start: next.activeWeek, label: next.weekLabel || INITIAL_LABEL
  };
  for (const person of list(next.people)) {
    for (const item of list(person.items)) item.weekId = item.weekId || next.activeWeek;
  }
  return next;
}
function account(person, activeWeek) {
  const groups = {};
  for (const [id, item] of records(person.items)) {
    const week = item.weekId || activeWeek;
    groups[week] = groups[week] || {week, total: 0, unknown: 0, items: [], installments: []};
    groups[week].items.push({id, ...item});
    groups[week].total += cents(item.price);
    if (item.price == null) groups[week].unknown++;
  }
  const installments = [];
  for (const group of list(groups)) {
    const plan = person.plans?.[group.week];
    const configured = plan && WEEK_OPTIONS.includes(Number(plan.count)) && validDate(plan.firstDue);
    group.plan = configured ? plan : null;
    const count = configured ? Number(plan.count) : 1;
    const regular = Math.floor(group.total / count);
    for (let index = 0; index < count; index++) {
      const amount = index === count - 1 ? group.total - regular * (count - 1) : regular;
      const installment = {
        week: group.week, index, amount, paid: 0,
        due: configured ? addDays(plan.firstDue, index * 7) : null
      };
      group.installments.push(installment);
      installments.push(installment);
    }
  }
  // Unscheduled legacy purchases remain payable, without invented overdue dates.
  installments.sort((a,b) => (a.due || a.week).localeCompare(b.due || b.week) || a.week.localeCompare(b.week) || a.index-b.index);
  const payments = records(person.payments).map(([id,p]) => ({id, ...p, paidOn: paymentDate(p)}));
  payments.sort((a,b) => (a.paidOn || '').localeCompare(b.paidOn || '') || a.id.localeCompare(b.id));
  let credit = 0;
  for (const payment of payments) {
    let remaining = cents(payment.amount);
    for (const installment of installments) {
      const applied = Math.min(remaining, installment.amount - installment.paid);
      installment.paid += applied;
      remaining -= applied;
      if (remaining === 0) break;
    }
    credit += remaining;
  }
  const total = list(groups).reduce((sum,g) => sum+g.total,0);
  const paid = payments.reduce((sum,p) => sum+cents(p.amount),0);
  for (const group of list(groups)) {
    group.balance = group.installments.reduce((sum,i) => sum+i.amount-i.paid,0);
    group.remainingCount = group.installments.filter(i => i.amount > i.paid).length;
  }
  return {groups, installments, payments, total, paid, balance: Math.max(0,total-paid), credit};
}
function collectionStatus(result, start, today) {
  const end = addDays(start,6);
  const reported = result.payments.filter(p => p.paidOn && p.paidOn >= start && p.paidOn <= end).reduce((sum,p)=>sum+cents(p.amount),0);
  const scheduled = result.installments.filter(i => i.due && i.due >= start && i.due <= end);
  const pending = scheduled.reduce((sum,i)=>sum+i.amount-i.paid,0);
  const overdue = result.installments.filter(i => i.due && i.due < today).reduce((sum,i)=>sum+i.amount-i.paid,0);
  return {reported, pending, overdue, scheduled: scheduled.length};
}
function accountMessage(person, group, label) {
  if (!group) throw Error('No hay compras en la semana seleccionada.');
  const lines = ['WD Ventas Men', person.name, '', 'Compras de semana · ' + label];
  for (const item of group.items) lines.push(`• ${item.name} — ${item.price == null ? 'precio por confirmar' : money(cents(item.price))}`);
  lines.push('', 'Total: ' + money(group.total));
  if (group.unknown) lines.push('Hay artículos con precio por confirmar.');
  if (group.plan) {
    const count = Number(group.plan.count);
    if (count === 1) lines.push('Plan de pago: al contado');
    else {
      const first = group.installments[0].amount;
      const last = group.installments[count-1].amount;
      lines.push(`Plan de pago: ${count} pagos semanales`);
      lines.push(first === last ? `${count} pagos de ${money(first)}` : `${count-1} pagos de ${money(first)} y un último pago de ${money(last)}`);
    }
    lines.push('Primer pago: ' + readableDate(group.plan.firstDue));
  }
  if (person.note) lines.push('',person.note);
  return lines.join('\n');
}
</script>

const $ = id => document.getElementById(id);

$('collection-week').value = today() === initialCollection ? addDays(initialCollection,-7) : initialCollection;

function notice(message) { $('notice').textContent = message; }
function failure(error) {
  console.error(error);
  notice(/permission|denied/i.test(String(error.message)) ? 'Firebase rechazó la operación. Revisa los permisos de la base de datos.' : error.message || String(error));
}
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function button(label, action) {
  const node = element('button', label);
  node.type = 'button';
  node.addEventListener('click', async () => {
    node.disabled = true;
    try { await action(); } catch (error) { failure(error); }
    finally { node.disabled = false; }
  });
  return node;
}
function field(label, type = 'text', required = false) {
  const wrapper = element('label',label);
  const input = element(type === 'textarea' ? 'textarea' : 'input');
  if (type !== 'textarea') input.type = type;
  input.required = required;
  if (type === 'number') { input.min = '0'; input.step = '.01'; }
  wrapper.append(input);
  return {wrapper,input};
}
function selectField(label, options) {
  const wrapper = element('label',label);
  const input = element('select');
  for (const [value,text] of options) { const option = element('option',text); option.value=value; input.append(option); }
  wrapper.append(input);
  return {wrapper,input};
}
function submitButton(label) { const node = element('button',label); node.type = 'submit'; return node; }
function handleSubmit(form, action) {
  form.addEventListener('submit',async event => {
    event.preventDefault();
    const buttons = [...form.querySelectorAll('button')];
    buttons.forEach(node => node.disabled = true);
    try { await action(); } catch (error) { failure(error); }
    finally { buttons.forEach(node => node.disabled = false); }
  });
}
function person(key) {
  if (!data?.people?.[key]) throw Error('La persona ya no existe.');
  return data.people[key];
}
function item(key,id) {
  const value = person(key).items?.[id];
  if (!value) throw Error('El artículo ya no existe.');
  return value;
}
function weekText(id) { return data.weeks?.[id]?.label || (validDate(id) ? weekLabel(id) : id); }
function path(key) { return 'tracker/people/' + key; }
async function changePerson(key, mutate) {
  // A transaction prevents a concurrent delete/rename from recreating a partial customer.
  const result = await runTransaction(ref(database,path(key)), current => {
    if (!current) return;
    return mutate(current);
  }, {applyLocally:false});
  if (!result.committed) throw Error('El registro cambió. Revisa los datos y vuelve a intentarlo.');
}
function confirmDialog(text, fields = []) {
  return new Promise(resolve => {
    const dialog = $('dialog');
    dialog.replaceChildren();
    const form = element('form'); form.method = 'dialog';
    form.append(element('p',text),...fields);
    const actions = element('div',null,'actions');
    const cancel = submitButton('Cancelar'); cancel.value = 'cancel'; cancel.formNoValidate = true;
    const confirm = submitButton('Confirmar'); confirm.value = 'confirm';
    actions.append(cancel,confirm); form.append(actions); dialog.append(form);
    dialog.returnValue = '';
    dialog.addEventListener('close', () => resolve(dialog.returnValue === 'confirm'), {once:true});
    dialog.showModal();
  });
}
function messageDialog(text, phone) {
  const dialog = $('dialog'); dialog.replaceChildren();
  const message = field('Mensaje de WhatsApp','textarea'); message.input.value = text;
  const link = element('a','Abrir WhatsApp'); link.target = '_blank'; link.rel = 'noopener noreferrer';
  const digits = String(phone).replace(/\D/g, '');
  if (!/^[1-9]\d{6,14}$/.test(digits)) {
    throw Error('Revisa el teléfono del cliente e incluye el código de país.');
  }
  const updateLink = () => { link.href = `https://wa.me/${digits}?text=${encodeURIComponent(message.input.value)}`; };
  updateLink(); message.input.addEventListener('input',updateLink);
  const actions = element('div',null,'actions'); actions.append(link,button('Cerrar',()=>dialog.close()));
  dialog.append(message.wrapper,actions); dialog.showModal();
}
function inlineEditor(host,label,read,save,type='text',optional=false) {
  const wrapper = element('div',null,'editor');
  const form = element('form'); form.hidden = true;
  const control = field(label,type,!optional);
  const open = button(label,()=>{ control.input.value=read() ?? ''; form.hidden=false; open.hidden=true; control.input.focus(); });
  const close = () => {form.hidden=true;open.hidden=false;};
  const actions = element('div',null,'actions'); actions.append(submitButton('Guardar'),button('Cancelar',close));
  form.append(control.wrapper,actions);
  handleSubmit(form,async()=>{await save(control.input.value);close();});
  wrapper.append(open,form); host.append(wrapper);
}
function imageSource(value) {
  if (!value) return '';
  if (/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=\s]+$/.test(value)) return value;
  if (/^[A-Za-z0-9][A-Za-z0-9_. -]*\.(jpg|jpeg|png|webp|gif)$/i.test(value)) return './images/' + encodeURIComponent(value);
  return '';
}
async function uploadPhoto(file) {
  if (!file) return null;
  if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) throw Error('Selecciona una foto JPG, PNG, WEBP o GIF.');
  if (file.size > 20*1024*1024) throw Error('Selecciona una foto de menos de 20 MB.');
  const url = URL.createObjectURL(file);
  try {
    const image = new Image(); image.src=url; await image.decode();
    const scale = Math.min(1,1600/Math.max(image.width,image.height));
    const canvas = document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.width*scale)); canvas.height=Math.max(1,Math.round(image.height*scale));
    const context=canvas.getContext('2d'); context.fillStyle='white'; context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',.85);
  } finally { URL.revokeObjectURL(url); }
}
function exportData() {
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const link=element('a');
  link.href=url;link.download=`wd-ventas-men-${today()}.json`;link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function registerPayment(key,value,date,note) {
  const amount=parseAmount(value);
  if (amount <= 0) throw Error('El pago debe ser mayor que cero.');
  if (!validDate(date) || date > today()) throw Error('Selecciona la fecha real del pago, sin fechas futuras.');
  const id=push(ref(database,path(key)+'/payments')).key;
  await changePerson(key,current=>{
    current.payments=current.payments || {};
    current.payments[id]={amount,paidOn:date,date:new Date().toISOString(),note:note.trim()};
    return current;
  });

}

  actions.append(button('Cambiar foto',()=>file.click()),button('Quitar',async()=>{

  }));node.append(file);

    title.textContent=value.name;price.textContent=value.price==null?'precio por confirmar':money(cents(value.price));
    date.textContent=value.date || '';detail.textContent=value.detail || '';flag.textContent=value.flag || '';flag.hidden=!value.flag;

}
function createCard(key) {

  menuItems.append(
    button('Resumen de cuenta',()=>{menu.open=false;messageDialog(accountMessage(person(key),chosenGroup(),weekText(purchaseWeek.input.value)),person(key).phone);}),

    button('Confirmación de pago',()=>{

  const planSection=element('section',null,'section');planSection.append(element('h3','Plan de pago de estas compras'));

  const firstDue=field('Fecha del primer pago','date',true);

  handleSubmit(planForm,async()=>{

  const addSection=element('section',null,'section');addSection.append(element('h3','Agregar artículo a la semana seleccionada'));
  const addForm=element('form');const product=field('Producto','text',true),price=field('Precio (opcional)','number'),date=field('Fecha o referencia (opcional)'),detail=field('Detalle (opcional)'),photo=field('Foto (opcional)','file');
  photo.input.accept='image/jpeg,image/png,image/webp,image/gif';
  addForm.append(product.wrapper,price.wrapper,date.wrapper,detail.wrapper,photo.wrapper,submitButton('Agregar artículo'));
  handleSubmit(addForm,async()=>{

    const id=push(ref(database,path(key)+'/items')).key;

  });addSection.append(addForm);body.append(addSection);
  const history=element('section',null,'section');body.append(history);
  const paymentForm=element('form');const amount=field('Monto','number',true),paidOn=field('Fecha del pago','date',true),paymentNote=field('Nota (opcional)');paidOn.input.value=today();
  paymentForm.append(element('h3','Registrar pago'),amount.wrapper,paidOn.wrapper,paymentNote.wrapper,submitButton('Registrar pago'));
  handleSubmit(paymentForm,async()=>{await registerPayment(key,amount.input.value,paidOn.input.value,paymentNote.input.value);amount.input.value='';paymentNote.input.value='';});body.append(paymentForm);
  purchaseWeek.input.addEventListener('change',()=>{planDirty=false;refresh(person(key));});
  let selectedActiveWeek;
  function refresh(value){
    const result=account(value,data.activeWeek),collection=monday($('collection-week').value || today());

    name.textContent=value.name;phone.textContent=value.phone;
    summary.textContent=`Total: ${money(result.total)} · Pagado: ${money(result.paid)} · Saldo: ${money(result.balance)}`+(result.credit?` · A favor: ${money(result.credit)}`:'');
    note.textContent=value.note || '';note.hidden=!value.note;badges.replaceChildren();
    badges.append(element('span',status.reported?`Pago registrado esta semana: ${money(status.reported)}`:'Sin pago registrado esta semana','badge'));
    if(list(result.groups).some(group=>group.unknown>0))badges.append(element('span','Hay precios por confirmar','badge'));
    else if(!list(result.groups).length)badges.append(element('span','Sin compras','badge'));
    else if(result.balance===0)badges.append(element('span','Cuenta liquidada','badge'));
    else if(status.scheduled)badges.append(element('span',status.pending?`Pendiente de esta semana: ${money(status.pending)}`:'Pago de esta semana cubierto','badge'));
    else badges.append(element('span','Sin vencimiento programado esta semana','badge'));
    if(status.overdue)badges.append(element('span',`Vencido: ${money(status.overdue)}`,'badge'));
    overdueButton.hidden=status.overdue===0;
    const selected=purchaseWeek.input.value;
    const weeks=[...new Set([data.activeWeek,...Object.keys(result.groups)])].sort().reverse();
    purchaseWeek.input.replaceChildren();
    for(const week of weeks){const option=element('option',weekText(week));option.value=week;purchaseWeek.input.append(option);}
    purchaseWeek.input.value=weeks.includes(selected)?selected:data.activeWeek;

    selectedActiveWeek=data.activeWeek;
    const group=result.groups[purchaseWeek.input.value];
    weekAccount.textContent=group?`Compras: ${money(group.total)} · Pendiente de esta semana de compras: ${money(group.balance)}`:'Sin compras en esta semana.';

    for(const [id,view] of itemViews){if(!visibleItems[id]){view.node.remove();itemViews.delete(id);}}
    for(const [id,value] of records(visibleItems)){let view=itemViews.get(id);if(!view){view=createItem(key,id);itemViews.set(id,view);items.append(view.node);}view.refresh(value);}
    if(!planDirty){count.input.value=group?.plan?.count || '';firstDue.input.value=group?.plan?.firstDue || '';}
    planInfo.replaceChildren();

    }else planInfo.textContent='Selecciona un plan y la fecha del primer pago para calcular vencimientos.';
    history.replaceChildren(element('h3','Historial por semana'));
    const table=element('table');const header=element('tr');for(const text of ['Compras de semana','Total','Pendiente'])header.append(element('th',text));table.append(header);
    for(const group of list(result.groups).sort((a,b)=>a.week.localeCompare(b.week))){const row=element('tr');for(const text of [weekText(group.week),money(group.total),money(group.balance)])row.append(element('td',text));table.append(row);}
    history.append(table,element('h3','Pagos registrados'));
    for(const payment of [...result.payments].reverse()){
      const row=element('div',null,'payment');row.append(element('span',`${payment.paidOn?readableDate(payment.paidOn):'Fecha por confirmar'} · ${money(cents(payment.amount))}${payment.note?' · '+payment.note:''} `),button('Quitar pago',async()=>{
        if(await confirmDialog('¿Quitar este pago y recalcular el saldo?'))await changePerson(key,current=>{if(current.payments)delete current.payments[payment.id];return current;});
      }));history.append(row);
    }
  }
  return {node,refresh};
}
function refreshPaymentDropdown(){
  const select=$('quick-payment').elements.person,selected=select.value;
  const query=normalize($('payment-search').value);
  select.replaceChildren();const empty=element('option','Seleccionar persona');empty.value='';select.append(empty);
  for(const [key,value] of records(data?.people).sort((a,b)=>a[1].name.localeCompare(b[1].name,'es'))){
    if(query && !normalize(value.name+' '+value.phone).includes(query) && !key.includes(query.replace(/\s/g,'')))continue;
    const option=element('option',`${value.name} · ${value.phone}`);option.value=key;select.append(option);
  }
  if([...select.options].some(option=>option.value===selected))select.value=selected;
}
function render(){
  if(!data)return;
  const people=data.people || {},collection=monday($('collection-week').value || today());
  let purchases=0,collected=0,balance=0,credit=0,items=0;
  for(const value of list(people)){
    const result=account(value,data.activeWeek);purchases+=result.groups[data.activeWeek]?.total || 0;balance+=result.balance;credit+=result.credit;items+=Object.keys(value.items||{}).length;
    collected+=result.payments.filter(p=>p.paidOn && p.paidOn>=data.activeWeek && p.paidOn<=addDays(data.activeWeek,6)).reduce((sum,p)=>sum+cents(p.amount),0);
  }
  $('week-label').textContent=weekText(data.activeWeek);
  $('summary').textContent=`Compras de esta semana: ${money(purchases)} · Cobrado esta semana: ${money(collected)} · Saldo pendiente total: ${money(balance)}`+(credit?` · A favor: ${money(credit)}`:'')+` · ${Object.keys(people).length} personas · ${items} artículos`;
  $('collection-label').textContent=`Estado de pagos del ${readableDate(collection)} al ${readableDate(addDays(collection,6))}. Los pagos se aplican al vencimiento pendiente más antiguo.`;
  for(const [key,view] of cards){if(!people[key]){view.node.remove();cards.delete(key);}}
  for(const [key,value] of records(people)){let view=cards.get(key);if(!view){view=createCard(key);cards.set(key,view);$('people').append(view.node);}view.refresh(value);}
  const order=records(people);
  const mode=$('sort').value;
  if(mode==='owed-desc')order.sort((a,b)=>account(b[1],data.activeWeek).balance-account(a[1],data.activeWeek).balance);
  else if(mode==='owed-asc')order.sort((a,b)=>account(a[1],data.activeWeek).balance-account(b[1],data.activeWeek).balance);
  for(const [key] of order){const view=cards.get(key);if(view)$('people').append(view.node);}
  filterCards();refreshPaymentDropdown();
}
function filterCards(){
  const query=normalize($('search').value),digits=query.replace(/\D/g,'');let visible=0;
  for(const [key,view] of cards){const value=person(key);const matches=!query || normalize(value.name+' '+value.phone).includes(query) || (digits && key.includes(digits));view.node.hidden=!matches;if(matches)visible++;}
  $('empty').hidden=visible>0;
}
$('search').addEventListener('input',filterCards);
$('sort').addEventListener('change',()=>{render();});
$('payment-search').addEventListener('input',refreshPaymentDropdown);
$('collection-week').addEventListener('change',()=>{if(validDate($('collection-week').value))render();});
handleSubmit($('quick-payment'),async()=>{
  const form=$('quick-payment');await registerPayment(form.elements.person.value,form.elements.amount.value,form.elements.date.value,form.elements.note.value);
  form.elements.amount.value='';form.elements.note.value='';
});
handleSubmit($('add-person'),async()=>{
  const form=$('add-person'),name=form.elements.name.value.trim(),phone=form.elements.phone.value.trim(),key=phoneKey(phone);
  if(!name)throw Error('Escribe un nombre.');
  const result=await runTransaction(ref(database,path(key)),current=>current===null?{name,phone}:undefined,{applyLocally:false});
  if(!result.committed)throw Error('Ya existe una persona con ese teléfono.');form.reset();

$('export').addEventListener('click',exportData);
$('new-week').addEventListener('click',async()=>{
  try{
    const start=field('Lunes de la nueva semana','date',true);start.input.value=addDays(data.activeWeek,7);
    if(!await confirmDialog('Abrir una nueva semana de compras. Los saldos, pagos y planes continúan con sus fechas originales.',[start.wrapper]))return;
    if(!validDate(start.input.value) || monday(start.input.value)!==start.input.value || start.input.value<=data.activeWeek)throw Error('Selecciona un lunes posterior a la semana activa.');
    if(!await confirmDialog('¿Confirmar el cambio de semana? Se descargará una copia de los datos actuales.'))return;
    exportData();const expected=data.activeWeek,newWeek=start.input.value;
    const result=await runTransaction(ref(database,'tracker'),current=>{
      if(!current || current.activeWeek!==expected)return;
      for(const person of list(current.people))for(const item of list(person.items))item.weekId=item.weekId || expected;
      current.weeks=current.weeks || {};current.weeks[newWeek]={start:newWeek,label:weekLabel(newWeek)};
      current.activeWeek=newWeek;current.weekLabel=weekLabel(newWeek);return current;
    },{applyLocally:false});
    if(!result.committed)throw Error('La semana cambió desde otra ventana. Revisa la semana activa.');notice('Nueva semana abierta.');
  }catch(error){failure(error);}
});
function validateBackup(raw){
  if(!raw || typeof raw!=='object' || typeof raw.people!=='object')throw Error('El archivo no contiene un respaldo válido.');
  const result=structuredClone(raw);result.people={};
  for(const value of list(raw.people)){
    if(!value || typeof value.name!=='string' || !value.name.trim() || typeof value.phone!=='string')throw Error('Hay una persona inválida.');
    const key=phoneKey(value.phone);if(result.people[key])throw Error('Hay teléfonos duplicados.');
    value.items=Object.fromEntries(records(value.items).map(([id,item])=>{
      if(!/^[A-Za-z0-9_-]+$/.test(id) || !item || typeof item.name!=='string')throw Error('Artículo inválido.');
      item.price=parseAmount(item.price,true);if(item.weekId && !validDate(item.weekId))throw Error('Semana inválida.');
      if(item.photo && !imageSource(item.photo))throw Error('Foto inválida.');return [id,item];
    }));
    for(const [id,payment] of records(value.payments)){
      if(!/^[A-Za-z0-9_-]+$/.test(id) || !payment || parseAmount(payment.amount)<=0)throw Error('Pago inválido.');
      if(!paymentDate(payment))throw Error('Hay un pago sin fecha válida.');
    }
    for(const [week,plan] of records(value.plans))if(!validDate(week) || !WEEK_OPTIONS.includes(Number(plan.count)) || !validDate(plan.firstDue))throw Error('Plan de pago inválido.');
    result.people[key]=value;
  }
  if(result.schemaVersion>2)throw Error('Este respaldo necesita una versión más reciente del sitio.');
  if(result.schemaVersion===2 && !validDate(result.activeWeek))throw Error('Semana activa inválida.');
  return migrateTracker(result);
}
$('import').addEventListener('click',()=>$('import-file').click());
$('import-file').addEventListener('change',async event=>{
  try{
    const file=event.target.files[0];if(!file)return;
    if(file.size>50*1024*1024)throw Error('El respaldo debe pesar menos de 50 MB.');
    const imported=validateBackup(JSON.parse(await file.text()));
    if(!await confirmDialog('¿Reemplazar los datos compartidos con este respaldo? Se descargará una copia de los datos actuales.'))return;
    exportData();await set(ref(database,'tracker'),imported);notice('Respaldo importado.');
  }catch(error){failure(error);}finally{event.target.value='';}
});
try{
  const [appSDK,databaseSDK]=await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js')
  ]);
  ({ref,get,set,push,runTransaction,onValue}=databaseSDK);
  database=databaseSDK.getDatabase(appSDK.initializeApp(firebaseConfig));
  const tracker=ref(database,'tracker');await get(tracker);
  await runTransaction(tracker,current=>{
    if(current?.schemaVersion>=2)return;
    return migrateTracker(current || {people:{},weekLabel:INITIAL_LABEL});
  },{applyLocally:false});
  onValue(tracker,snapshot=>{
    const value=snapshot.val();
    data=value || {schemaVersion:2,activeWeek:INITIAL_WEEK,weekLabel:INITIAL_LABEL,weeks:{[INITIAL_WEEK]:{start:INITIAL_WEEK,label:INITIAL_LABEL}},people:{}};
    if(data.schemaVersion!==2){notice('Se detectó una versión de datos diferente. Recarga la página.');return;}
    render();
    for(const id of ['new-week','export','import'])$(id).disabled=false;
    $('quick-payment').elements.person.disabled=false;
    $('quick-payment').querySelector('button').disabled=false;
    $('add-person').querySelector('button').disabled=false;
    if(!value)notice('No hay datos en Firebase. Importa tu respaldo JSON para recuperar tus compras y pagos.');
  },failure);
  onValue(ref(database,'.info/connected'),snapshot=>{
    $('connection').textContent=snapshot.val()?'Conectado · Cambios compartidos en tiempo real':'Sin conexión · Mantén la página abierta hasta que se guarden los cambios';
  });
  setInterval(()=>{if(data)render();},60000);
}catch(error){$('connection').textContent='No se pudo conectar con Firebase.';failure(error);}
</script>
